name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default to read-only token permissions (CodeQL: actions/missing-workflow-permissions).
# Individual jobs can re-grant if they ever need to write.
permissions:
  contents: read

# Cancel in-flight runs on force-push to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datalearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test DB
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/datalearn
      # Auth.js requires these to be present (test bypasses OAuth via DB
      # session inserts in tests/e2e/fixtures/db.ts).
      AUTH_SECRET: ci-test-secret-${{ github.run_id }}-do-not-reuse
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ci-dummy
      AUTH_GITHUB_SECRET: ci-dummy
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
      # API key hashing secret (HMAC-SHA-256 in lib/api-auth.ts). Run-scoped
      # so each CI run gets a fresh value; tests don't share keys across runs.
      API_KEY_HASH_SECRET: ci-test-key-secret-${{ github.run_id }}-do-not-reuse

    steps:
      - uses: actions/checkout@v6

      - name: Palette guard
        run: ./scripts/check-no-palette-colors.sh

      - name: Shadcn token definition guard
        run: ./scripts/check-shadcn-token-definitions.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # 91 is the current warning count (pre-existing debt, not new). This
        # only ratchets down: fixing warnings lets you lower the number,
        # adding a new one fails the build. Errors always fail regardless of
        # this flag.
        run: npm run lint -- --max-warnings 91
      - name: Check CI coverage of test/check/audit/verify scripts
        run: npm run check:ci-coverage

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npx tsx prisma/seed.ts

      - name: Seed visual lesson
        run: npm run seed:visual

      # Deliberately NOT seeding prisma/seed-analyst-track.ts here, despite
      # repeated proposals (most recently during SP6). Every curriculum test
      # now creates and cleans up its own fixture on purpose. Seeding a
      # shared curriculum track would reintroduce the ambient-data coupling
      # that caused several failures this month: tests that passed locally
      # and failed in CI, and tests that silently skipped locally because a
      # seeded track happened to already be present. A curriculum-free CI is
      # what makes the self-fixturing discipline enforceable -- this is a
      # decision, not an oversight.

      - name: Verify pass-rate counters
        run: npm run verify:pass-rate

      - name: Audit SQL dialect outputs
        run: npm run audit:dialects:ci

      - name: Test SQL read-only guard
        run: npm run test:sql-restrict

      - name: Test SQL engine telemetry
        run: npm run test:sql-engine-telemetry

      - name: Test PGlite corrupt-cache recovery
        run: npm run test:pglite-recovery

      - name: Test DuckDB browser init fallback
        run: npm run test:duckdb-init

      - name: Test SQL engine warmup registry
        run: npm run test:sql-engine-warmup

      - name: Test SQL engine internals (result cap, runtime controls, JSON/time validator, dialect audit helpers)
        run: |
            npm run test:sql-engine-result-cap
            npm run test:sql-engine-runtime-controls
            npm run test:sql-validator-json-time
            npm run test:dialect-audit

      - name: Test solution resolver
        run: npm run test:solutions

      - name: Test PGlite schema cache key
        run: npm run test:schema-cache-key

      - name: Test tag-discovery actions
        run: npm run test:tag-discovery

      - name: Test companies tagging actions
        run: npm run test:companies-tagging

      - name: Test tracks actions
        run: npm run test:tracks

      - name: Test time-zone helpers and topic lane
        run: |
            npm run test:time-ist
            npm run test:topic-lane

      - name: Test curriculum progress
        run: npm run test:curriculum-progress

      - name: Test curriculum admin validation
        run: npm run test:curriculum-admin-validation

      - name: Test curriculum admin
        run: npm run test:curriculum-admin

      - name: Test curriculum actions
        run: npm run test:curriculum-actions

      - name: Test approaches
        run: npm run test:approaches

      - name: Test checkpoint backfill
        run: npm run test:checkpoint-backfill

      - name: Test contest core (status, admin validation, locks, leaderboard, play, contests, custom contests)
        run: |
            npm run test:contest-status
            npm run test:contest-admin-validation
            npm run test:contest-locks
            npm run test:contest-leaderboard
            npm run test:contest-play
            npm run test:contests
            npm run test:custom-contests

      - name: Test contest judge engine (validator, engines, queue, escape, warmup, hidden validator, submit)
        run: |
            npm run test:contest-judge-validator
            npm run test:contest-judge-engines
            npm run test:contest-judge-queue
            npm run test:contest-judge-escape
            npm run test:contest-judge-warmup
            npm run test:contest-hidden-validator
            npm run test:contest-submit

      - name: Test article publish validation
        run: npm run test:article-publish-validation

      - name: Test content rendering (directives, mermaid sanitization, discussion helpers)
        run: |
            npm run test:directive-renderer
            npm run test:mermaid-sanitization
            npm run test:discussion

      - name: Test asset & upload housekeeping (gc, quota race, phase-1 atomicity, delete retry)
        run: |
            npm run test:asset-gc
            npm run test:upload-phase1-atomicity
            npm run test:upload-quota-race
            npm run test:admin-asset-delete-retry

      - name: Audit tags & admin audit log
        run: |
            npm run audit:tags
            npm run test:admin-audit-log

      # test:uploads, test:admin-asset-delete and test:asset-delete-references
      # exercise real HTTP routes (multipart upload, admin delete, in-use
      # delete) via fetch, so -- like "Test article publish routes" below --
      # they need a live server. Unlike that step, they can't reuse the
      # production `npm run start` server: they authenticate through the
      # X-Test-User-Id bypass in lib/api-auth.ts and the DATALEARN_FAKE_BLOB
      # fake-blob-store path in lib/uploads/blob.ts, both of which are
      # intentionally disabled whenever NODE_ENV === "production" (verified
      # locally: the same three tests get a 502 blob-write-failed against a
      # `next start` server, and pass against `next dev`). So this step
      # boots its own dev-mode server on a scratch port instead, and removes
      # its build output afterwards so it can't leak into the production
      # `next build` a few steps down.
      - name: Test uploads and asset deletion (needs a non-production server)
        run: |
            DATALEARN_FAKE_BLOB=1 npm run dev -- -p 3102 &
            SERVER_PID=$!
            trap "kill $SERVER_PID" EXIT

            for i in {1..30}; do
              if curl -fsS http://localhost:3102/api/health >/dev/null; then
                break
              fi
              sleep 1
            done

            curl -fsS http://localhost:3102/api/health >/dev/null
            TEST_BASE_URL=http://localhost:3102 npm run test:uploads
            TEST_BASE_URL=http://localhost:3102 npm run test:admin-asset-delete
            TEST_BASE_URL=http://localhost:3102 npm run test:asset-delete-references

            kill $SERVER_PID
            wait $SERVER_PID 2>/dev/null || true
            trap - EXIT
            rm -rf .next

      - name: Check MCP bundle isolation
        run: npm run check:mcp-bundle-isolation

      - name: Test MCP e2e log redaction
        run: npm run test:mcp-e2e-log-redaction

      - name: Check token theme parity
        run: npm run check:token-parity

      - name: Check theme utility mapping
        run: npm run check:theme-utilities

      - name: Test console nav model
        run: npm run test:console-nav

      - name: Test admin nav model
        run: npm run test:admin-nav

      - name: Admin metric deltas
        run: npm run test:metric-delta

      - name: Test problems panel model
        run: npm run test:problems-panel

      - name: Admin problems filter
        run: npm run test:problems-filter

      - name: Admin form tabs
        run: npm run test:form-tabs

      - name: Test catalog model
        run: npm run test:catalog-model

      - name: Test module model
        run: npm run test:module-model

      - name: Test tracks model
        run: npm run test:tracks-model

      - name: Test pass rate
        run: npm run test:pass-rate

      - name: Test approach sort
        run: npm run test:approach-sort

      - name: Test weak spots
        run: npm run test:weak-spots

      - name: Test today's plan
        run: npm run test:today-plan

      - name: Test active track selection
        run: npm run test:active-track

      - name: Test lesson nav model
        run: npm run test:lesson-nav

      - name: Test reading progress
        run: npm run test:reading-progress

      - name: Test scroll restoration
        run: npm run test:scroll-restoration

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test article publish routes
        run: |
          npm run start -- -p 3101 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in {1..30}; do
            if curl -fsS http://localhost:3101/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:3101/api/health >/dev/null
          TEST_BASE_URL=http://localhost:3101 npm run test:article-publish-routes

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
